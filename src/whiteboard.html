<title>Shree's Whiteboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="site.css">
<style>
/* Layout: full-screen app. Sticky nav on top, an infinite pannable board below, a floating toolbar. */
:root { --hand: "Caveat", "Comic Sans MS", cursive; }
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.nav { position: relative; }
#board { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; background-color: var(--ink);
  background-image: radial-gradient(circle, #23263a 1px, transparent 1.2px); background-size: 28px 28px; }
#board.panning { cursor: grabbing; }
#layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: -2000px; top: -2000px; width: 6000px; height: 6000px; overflow: visible; pointer-events: none; }
#wires path { fill: none; stroke-width: 2; pointer-events: stroke; }
#wires path.mine { stroke: var(--spark); stroke-dasharray: 6 6; cursor: pointer; }
#wires path.seed { stroke: rgba(90,169,255,.45); }
#wires path.live { stroke: var(--spark); stroke-dasharray: 4 6; }
.cl { position: absolute; font: 500 40px/1 var(--hand); color: var(--mute); opacity: .45; white-space: nowrap; pointer-events: none; }
.note { position: absolute; width: 230px; padding: 14px 16px 12px; border-radius: 4px; color: #16130e; box-shadow: 0 8px 22px rgba(0,0,0,.45); cursor: move; user-select: none; -webkit-user-select: none; display: grid; gap: 8px; transition: box-shadow .2s; }
.note:hover { box-shadow: 0 12px 30px rgba(0,0,0,.6), 0 0 0 2px var(--diamond); }
.note p { margin: 0; font: 600 24px/1.1 var(--hand); }
.note .ft { display: flex; justify-content: space-between; align-items: center; font: 11px var(--mono); opacity: .6; gap: 6px; }
.note .ft .pl:not(.on) { opacity: 0; transition: opacity .2s; }
.note:hover .ft .pl, .note:focus-within .ft .pl { opacity: 1; }
.note .h { opacity: .35; transition: opacity .2s; } .note:hover .h { opacity: 1; }
.note .ft button { font: 11px var(--mono); background: rgba(0,0,0,.08); border: 0; border-radius: 999px; padding: 3px 8px; cursor: pointer; color: inherit; }
.note .ft button.on { background: #16130e; color: #fff; }
.note .h { position: absolute; right: -8px; top: 50%; width: 16px; height: 16px; margin-top: -8px; background: var(--diamond); transform: rotate(45deg); cursor: crosshair; border: 2px solid var(--ink); }
.note.mine .h { background: var(--spark); }
.note .x { position: absolute; top: 4px; right: 6px; background: none; border: 0; font: 16px var(--body); cursor: pointer; color: #16130e; opacity: .5; }
.note.target { box-shadow: 0 0 0 3px var(--spark), 0 12px 30px rgba(0,0,0,.6); }
.c-ai { background: #cfe3ff; } .c-stage { background: #ffe1a8; } .c-build { background: #c9f0d8; } .c-self { background: #f6c9c9; } .c-life { background: #e7dcff; } .c-you { background: #fff6d8; outline: 2px dashed #ffb547; outline-offset: -6px; }
.bar { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(16px, calc(env(safe-area-inset-bottom, 0px) + 16px)); display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: rgba(16,18,26,.92); border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: calc(100% - 32px); flex-wrap: wrap; justify-content: center; }
.bar .btn { padding: 10px 14px; font-size: 13px; }
.intro { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 16px; max-width: 360px; padding: 16px 18px; border-radius: 14px; background: rgba(16,18,26,.92); border: 1px solid var(--line); display: grid; gap: 8px; }
.intro h1 { font-size: 28px; }
.intro p { margin: 0; color: var(--mute); font-size: 14px; }
.intro .legend { display: flex; flex-wrap: wrap; gap: 6px; }
.intro .legend span { font: 11px var(--mono); padding: 3px 8px; border-radius: 4px; color: #16130e; }
.intro .close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--mute); font-size: 18px; cursor: pointer; }
dialog { border: 1px solid var(--line); background: var(--panel); color: var(--paper); border-radius: 16px; padding: 22px; width: min(420px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog form { display: grid; gap: 12px; }
dialog textarea, dialog input { background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 15px var(--body); resize: vertical; }
dialog textarea:focus, dialog input:focus { outline: none; border-color: var(--diamond); }
.toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 8px 14px; border-radius: 999px; font: 600 13px var(--body); opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 600px) { .intro { right: max(16px, env(safe-area-inset-right, 0px)); max-width: none; } .intro p.long { display: none; } }
</style>

<nav class="nav" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="index.html"><i></i>Shree</a>
    <ul>
      <li><a href="index.html#memory">Memory</a></li>
      <li><a href="index.html#journey">Journey</a></li>
      <li class="keep"><a href="index.html#twin">Twin</a></li>
      <li><a href="index.html#work">Work</a></li>
      <li class="keep"><a href="whiteboard.html" aria-current="page">Whiteboard</a></li>
    </ul>
  </div>
</nav>

<main id="board" aria-label="Whiteboard of raw thoughts">
  <div id="layer"><svg id="wires" viewBox="-2000 -2000 6000 6000"></svg></div>
  <div class="intro" id="intro">
    <button class="close" id="intro-x" type="button" aria-label="Hide intro">×</button>
    <span class="eyebrow">Raw thoughts</span>
    <h1>The whiteboard</h1>
    <p>Lines straight from my diary. Drag notes around. Pull the ◆ on any note onto another to connect two thoughts. Pin your own.</p>
    <div class="legend" id="legend"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="bar">
    <button class="btn primary" id="add" type="button">+ Pin a thought</button>
    <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
    <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
    <button class="btn" id="fit" type="button">Fit</button>
    <button class="btn" id="clear" type="button">Clear mine</button>
  </div>
</main>

<dialog id="dlg">
  <form id="add-form" method="dialog">
    <h2 style="font-size:28px">Pin a thought</h2>
    <textarea id="add-text" rows="4" maxlength="220" placeholder="Something that's been stuck in your head…" required></textarea>
    <input id="add-name" maxlength="40" placeholder="Your name (optional)">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" type="button" id="add-cancel">Cancel</button>
      <button class="btn primary" type="submit">Pin it</button>
    </div>
  </form>
</dialog>

<script src="data.js"></script>
<script src="whiteboard.js"></script>
