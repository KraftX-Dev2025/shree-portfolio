<title>Shree's Thoughts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=display=swap">
<link rel="stylesheet" href="site.css">
<style>
/* Layout: full-screen canvas under the sticky nav. Title sits on the canvas top-left, quiet text controls bottom-left. */
html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }
.nav { position: relative; }
#board { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; background-color: var(--ink);
  background-image: radial-gradient(circle, rgba(141,145,164,.09) 1px, transparent 1.2px); background-size: 32px 32px; }
#board.panning { cursor: grabbing; }
#layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: -2000px; top: -2000px; width: 6000px; height: 6000px; overflow: visible; pointer-events: none; }
#wires path { fill: none; stroke-width: 1; pointer-events: stroke; }
#wires path.seed { stroke: rgba(90,169,255,.4); }
#wires path.mine { stroke: var(--spark); stroke-dasharray: 4 5; cursor: pointer; stroke-width: 1.2; }
#wires path.live { stroke: var(--spark); stroke-dasharray: 3 5; }
.cl { position: absolute; font: 400 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--mute); white-space: nowrap; pointer-events: none; }

/* thought cards */
.note { position: absolute; width: 230px; padding: 16px 18px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(16,18,26,.72);
  cursor: move; user-select: none; -webkit-user-select: none; display: grid; gap: 12px; transition: border-color .2s; }
.note:hover, .note:focus-within { border-color: #3a3e55; }
.note p { margin: 0; font: 500 19px/1.25 var(--display); letter-spacing: -.01em; color: var(--paper); }
.note .ft { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 11px var(--mono); color: var(--mute); }
.note .who { display: inline-flex; align-items: center; gap: 8px; }
.note .who::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: var(--dot, var(--mute)); flex: none; }
.note .pl { font: 11px var(--mono); background: none; border: 0; padding: 0; cursor: pointer; color: var(--mute); opacity: 0; transition: opacity .2s, color .2s; }
.note .pl:hover { color: var(--paper); }
.note .pl.on { opacity: 1; color: var(--spark); }
.note:hover .pl, .note:focus-within .pl { opacity: 1; }
.note .h { position: absolute; right: -5px; top: 50%; width: 9px; height: 9px; margin-top: -5px; background: var(--diamond); transform: rotate(45deg); cursor: crosshair; opacity: 0; transition: opacity .2s; }
.note:hover .h, .note.target .h { opacity: 1; }
.note.mine { border-style: dashed; }
.note.mine .h { background: var(--spark); }
.note .x { position: absolute; top: 6px; right: 8px; background: none; border: 0; font: 15px var(--body); cursor: pointer; color: var(--mute); opacity: 0; }
.note:hover .x { opacity: 1; }
.note.target { border-color: var(--diamond); }
@media (hover: none) { .note .pl, .note .h, .note .x { opacity: .7; } }
.c-ai { --dot: #5aa9ff; } .c-stage { --dot: #ffb547; } .c-build { --dot: #7fcf9f; } .c-self { --dot: #e48a8a; } .c-life { --dot: #a99be6; } .c-you { --dot: var(--spark); }

/* canvas chrome */
.title { position: absolute; left: max(24px, env(safe-area-inset-left, 0px)); top: 28px; display: grid; gap: 8px; pointer-events: none; max-width: 420px; }
.title h1 { font-size: clamp(40px, 6vw, 72px); font-weight: 500; letter-spacing: -.04em; }
.title p { margin: 0; color: var(--mute); font-size: 15px; }
.ctrl { position: absolute; left: max(24px, env(safe-area-inset-left, 0px)); bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px)); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ctrl button { background: none; border: 0; padding: 8px 6px; font: 400 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); cursor: pointer; transition: color .2s; }
.ctrl button:hover { color: var(--paper); }
.ctrl button#add { color: var(--diamond); }
.ctrl button#add:hover { color: var(--paper); }
.ctrl span { color: var(--line); }
dialog { border: 1px solid var(--line); background: var(--panel); color: var(--paper); border-radius: 16px; padding: 24px; width: min(440px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(7,8,12,.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
dialog form { display: grid; gap: 14px; }
dialog textarea, dialog input { background: var(--ink); color: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 15px var(--body); resize: vertical; }
dialog textarea:focus, dialog input:focus { outline: none; border-color: var(--diamond); }
.toast { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 16px)); font: 12px var(--mono); letter-spacing: .08em; color: var(--paper); opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (max-width: 600px) { .title { top: 18px; right: 24px; } .title p { font-size: 14px; } .toast { left: 24px; right: auto; bottom: 64px; } }
</style>

<main id="board" aria-label="Whiteboard of raw thoughts">
  <div id="layer"><svg id="wires" viewBox="-2000 -2000 6000 6000"></svg></div>
  <div class="title">
    <span class="eyebrow">Raw, from the diary</span>
    <h1>Thoughts</h1>
    <p>Drag them around. Pull the ◆ on one onto another to connect them.</p>
  </div>
  <div class="toast" id="toast"></div>
  <div class="ctrl">
    <button id="add" type="button">+ Add a thought</button><span>·</span>
    <button id="fit" type="button">Fit</button><span>·</span>
    <button id="clear" type="button">Clear mine</button>
  </div>
</main>

<dialog id="dlg">
  <form id="add-form" method="dialog">
    <h2 style="font-size:28px;font-weight:500">Add a thought</h2>
    <textarea id="add-text" rows="4" maxlength="220" placeholder="A thought worth keeping" required></textarea>
    <input id="add-name" maxlength="40" placeholder="Your name (optional)">
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" type="button" id="add-cancel">Cancel</button>
      <button class="btn primary" type="submit">Add it</button>
    </div>
  </form>
</dialog>
